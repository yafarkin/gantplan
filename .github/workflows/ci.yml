name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GantPlan.sln

      - name: Build
        run: dotnet build GantPlan.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test GantPlan.sln --no-build --configuration Release
