<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Дерево задач</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background: #f8f9fa;
            color: #343a40;
        }

        h2 {
            margin-bottom: 15px;
        }

        /* ===== CONTROLS ===== */
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls input, .controls select, .controls button {
            padding: 6px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }

        .controls input {
            min-width: 260px;
        }

        .controls button {
            background: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background .2s;
        }

        .controls button:hover {
            background: #0056b3;
        }

        /* ===== CHART =====
           Дерево и таймлайн - две независимые панели со своим скроллом,
           а не одна строка на flex со sticky-колонкой слева. Раньше
           штриховка/бары временами проступали поверх названий задач при
           горизонтальном скролле (известный класс багов Chrome, когда
           position:sticky не гарантированно перекрывает соседний контент,
           особенно с SVG-паттернами). С раздельными панелями это в
           принципе невозможно - у списка задач нет горизонтального
           скролла и нечему "проезжать" под ним; синхронизируется только
           вертикальный скролл (см. #tree-panel/#timeline-panel .on('scroll')). */
        #chart-wrap {
            display: flex;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            background: #fff;
            max-height: 78vh;
        }

        #tree-panel {
            flex: 0 0 520px;
            overflow-y: auto;
            overflow-x: hidden;
            border-right: 1px solid #dee2e6;
        }

        #timeline-panel {
            flex: 1 1 auto;
            overflow: auto;
        }

        .header-row {
            position: sticky;
            top: 0;
            z-index: 5;
            height: 22px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            box-sizing: border-box;
            background: #343a40;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
        }

        .tree-row {
            height: 24px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            box-sizing: border-box;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
            overflow: hidden;
        }

        #timeline-panel .tree-row {
            padding: 0;
        }

        /* Строки #timeline-panel (и линейка дат) должны быть РОВНО такой
           ширины, как их SVG (весь таймлайн целиком, без зума - см.
           PX_PER_DAY), а не ширины видимой панели - иначе SVG обрезается
           собственным overflow:hidden строки раньше, чем докручен до конца
           #timeline-panel, и кажется, что дальше "нет данных". width:
           fit-content вместо жёсткого 100% как раз и даёт строке физически
           стать такой же широкой, как её содержимое. */
        #timeline-panel .header-row, #timeline-panel .tree-row {
            width: fit-content;
            min-width: 100%;
        }

        .tree-row.stripe {
            background: #f8f9fa;
        }

        .tree-row.hover {
            background: #eef4ff;
        }

        .tree-row.muted {
            opacity: .55;
        }

        /* только название задачи обрезается многоточием - бейджи (Jira,
           исполнитель, статус) должны оставаться видимыми всегда, поэтому
           у них своя, нерезиновая, зона */
        .name-wrap {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badges {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .caret {
            display: inline-block;
            width: 16px;
            cursor: pointer;
            user-select: none;
            color: #6c757d;
        }

        .caret-empty {
            cursor: default;
        }

        .task-id {
            color: #6c757d;
            font-size: 12px;
        }

        .jira-badge, .assignee-badge, .status-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
        }

        a.jira-badge {
            background: #e7f1ff;
            color: #0d6efd;
            text-decoration: none;
        }

        a.jira-badge:hover {
            text-decoration: underline;
        }

        span.jira-badge {
            background: #eee;
            color: #6c757d;
        }

        /* родительский эпик - визуально приглушённее собственной метки задачи */
        .jira-badge.epic-badge {
            background: #f1f3f5;
            color: #495057;
            border: 1px solid #dee2e6;
        }

        .assignee-badge {
            background: #e9ecef;
            color: #343a40;
        }

        .status-badge {
            background: #f8d7da;
            color: #842029;
        }

        mark {
            background: #fff3a0;
            padding: 0;
        }

        .empty-message {
            padding: 16px;
            color: #6c757d;
        }

        /* ===== VIEW SWITCH ===== */
        .view-switch {
            display: inline-flex;
            border: 1px solid #ced4da;
            border-radius: 4px;
            overflow: hidden;
        }

        .view-switch button {
            border-radius: 0 !important;
            background: #fff !important;
            color: #343a40 !important;
        }

        .view-switch button.active {
            background: #007bff !important;
            color: #fff !important;
        }

        .legend {
            margin-bottom: 10px;
            font-size: 12px;
            color: #6c757d;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .legend svg {
            vertical-align: middle;
            border-radius: 2px;
        }

        /* подпись задачи внутри бара - рисуется на каждом баре (см.
           renderTaskBar), не только в свёрнутом ресурсе (дорожках Ганта):
           слева в дереве название и так видно, но при горизонтальном
           скролле timeline-панели далеко от начала бар - единственное,
           откуда видно, что это за задача, и откуда можно перейти в Jira */
        .gantt-bar-label {
            fill: #fff;
            font-size: 13px;
            pointer-events: none;
        }

        /* подпись на узком баре (см. renderTaskBar) - меньше, чтобы влезло
           больше текста, а не пропадала целиком */
        .gantt-bar-label.small {
            font-size: 10px;
        }

        /* задача со ссылкой на Jira - подчёркнута, как обычная ссылка, даже
           внутри цветного бара, где нет привычного синего цвета текста */
        .gantt-bar-label.linked {
            text-decoration: underline;
        }

        /* бар задачи с Jira-ссылкой (см. renderTaskBar/barLink) - курсор
           даёт понять, что по нему можно кликнуть, как и по бейджу слева */
        #timeline-panel svg a {
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Дерево задач</h2>
<div class="controls">
    <div class="view-switch">
        <button data-mode="resources" id="view-resources">По исполнителям</button>
        <button data-mode="tasks" id="view-tasks">По задачам</button>
    </div>
    <input id="search" placeholder="Поиск по номеру, названию или Jira-ключу" type="text">
    <input id="assignee-filter" list="assignee-list" placeholder="Исполнитель (можно часть слова, напр. dev)" type="text">
    <datalist id="assignee-list"></datalist>
    <button id="expand-all">Развернуть всё</button>
    <button id="collapse-all">Свернуть всё</button>
    <button id="clear-filters">Сбросить фильтры</button>
    <button id="goto-today" style="display: none;">На сегодня</button>
</div>
<div class="legend">
    <svg height="12" width="24"><rect fill="url(#hatch-global)" height="12" width="24"></rect></svg>
    общий нерабочий день (выходной/праздник) - штрихуется вся строка;
    <svg height="12" width="24"><rect fill="#1f77b4" height="12" width="24"></rect><rect fill="url(#hatch-personal)" height="12" width="24"></rect></svg>
    личный нерабочий день исполнителя (отпуск и т.п.) - штрихуется зеркальным узором только сама задача; если день и общий, и личный - штрихуются оба узора сразу
</div>
<svg height="0" style="position: absolute; width: 0;">
    <defs>
        <pattern height="6" id="hatch-global" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6">
            <rect fill="rgba(0,0,0,.05)" height="6" width="6"></rect>
            <line stroke="rgba(0,0,0,.3)" stroke-width="2" x1="0" x2="0" y1="0" y2="6"></line>
        </pattern>
        <pattern height="6" id="hatch-personal" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse" width="6">
            <line stroke="rgba(255,255,255,.85)" stroke-width="2" x1="0" x2="0" y1="0" y2="6"></line>
        </pattern>
    </defs>
</svg>
<div id="chart-wrap">
    <div id="tree-panel"></div>
    <div id="timeline-panel"></div>
</div>

<script>
    /* -------------------- placeholders, подставляются бэкендом -------------------- */
    const treeData = {{TreeData}};
    const globalNonWorking = {{global_non_working}};
    const resourceNonWorking = {{resource_non_working}};
    const factDateStr = {{fact_date}}; // "YYYY-MM-DD" дата среза "на сегодня" или null, если не задана
    /* -------------------------------------------------------------------------------- */

    // высота обычной строки (одна задача - один бар) и строки дорожки
    // Ганта (внутри свёрнутого ресурса, где на одной дорожке несколько
    // баров подряд и подпись нужна прямо внутри бара - там теснее, поэтому
    // строка вдвое выше).
    const ROW_HEIGHT = 24;
    const LANE_ROW_HEIGHT = ROW_HEIGHT * 2;

    // px на день - фиксированная величина, без зума. Зум убрали: смена
    // масштаба заставляла пересчитывать scrollLeft, и на реальных данных
    // это давало ощущение "дальше данные не рендерятся" при скролле вправо
    // (см. также fit-content на #timeline-panel .tree-row выше - вторая
    // часть той же истории). Один фиксированный масштаб проще и надёжнее;
    // 55px/день - чтобы число дня спокойно помещалось в ленте дат сверху.
    const PX_PER_DAY = 55;

    /* ===== DATE HELPERS ===== */
    function parseDate(str) {
        const [y, m, d] = str.split('-').map(Number);
        return new Date(y, m - 1, d);
    }

    const fmtDate = d3.timeFormat('%Y-%m-%d');

    function ymdLocal(d) {
        return d.toLocaleDateString('sv-SE');
    }

    function isWeekend(d) {
        return d.getDay() === 0 || d.getDay() === 6;
    }

    const globalHolidaySet = new Set(globalNonWorking);

    /* ===== INDEX THE TREE (даты, множество задач по id) ===== */
    const nodeById = new Map();
    const allDates = [];

    (function index(node) {
        if (node.Start) {
            node._start = parseDate(node.Start);
            allDates.push(node._start);
        }
        if (node.End) {
            node._end = parseDate(node.End);
            allDates.push(node._end);
        }
        nodeById.set(node.Id, node);
        node.Children.forEach(index);
    })(treeData);

    const minDate = d3.min(allDates) || new Date();
    const maxDate = d3.max(allDates) || new Date();
    const todayDate = factDateStr ? parseDate(factDateStr) : null;

    // ширина зоны с барами и масштаб - фиксированы (нет зума, см. PX_PER_DAY),
    // считаются один раз для всего документа.
    const totalDays = Math.max(1, d3.timeDay.count(minDate, d3.timeDay.offset(maxDate, 1)));
    const timelineWidth = totalDays * PX_PER_DAY;
    const xScale = d3.scaleTime()
        .domain([minDate, d3.timeDay.offset(maxDate, 1)])
        .range([0, timelineWidth]);

    // цвет - по ColorGroupId (задаётся бэкендом: id ближайшего предка на
    // глубине 1, то есть все подзадачи одной верхнеуровневой группы красятся
    // одним цветом независимо от того, как устроены сами id задач)
    const colorScale = d3.scaleOrdinal(d3.schemeCategory10)
        .domain(Array.from(new Set([...nodeById.values()].map(n => n.ColorGroupId))));

    /* ===== ASSIGNEE FILTER OPTIONS ===== */
    const assignees = Array.from(new Set([...nodeById.values()].map(n => n.Assignee).filter(Boolean))).sort();
    const hasUnassigned = [...nodeById.values()].some(n => n.Children.length === 0 && !n.Assignee);
    const resourceNames = hasUnassigned ? [...assignees, 'Без исполнителя'] : assignees;

    d3.select('#assignee-list')
        .selectAll('option')
        .data(assignees)
        .enter()
        .append('option')
        .attr('value', d => d);

    /* ===== VIEW: "по исполнителям" (по умолчанию - трек на человека,
       ресурсы свёрнуты: видно диаграмму Ганта, где внутри трека - его
       задачи, упакованные по дорожкам; разворачивание конкретного
       человека "расхлопывает" трек в дерево его эпиков/задач - те же
       узлы, что и в общем дереве, просто обрезанные до этого человека) или
       "по задачам" (дерево целиком). Оба режима рисуются одной и той же
       renderRow/markVisible логикой - "по исполнителям" просто подсовывает
       на верхнем уровне синтетические узлы-заголовки людей, дальше внутри -
       настоящие узлы дерева (см. buildResourceRoots/pruneForAssignee). */
    let viewMode = 'resources';

    function getRoots() {
        return viewMode === 'tasks' ? [treeData] : buildResourceRoots();
    }

    function buildResourceRoots() {
        return resourceNames
            .map(name => {
                const wanted = name === 'Без исполнителя' ? null : name;
                const children = treeData.Children
                    .map(c => pruneForAssignee(c, wanted))
                    .filter(Boolean);

                return children.length === 0 ? null : {
                    Id: `@resource@${name}`,
                    Name: name,
                    JiraKey: null, JiraUrl: null, EpicJiraKey: null, EpicJiraUrl: null, Assignee: null,
                    Start: null, End: null, StatusLabel: null,
                    ColorGroupId: name,
                    _isGroupHeader: true,
                    Children: children
                };
            })
            .filter(Boolean);
    }

    // Возвращает узел с урезанными до нужного исполнителя потомками (сам
    // узел, если это лист этого исполнителя; null, если внутри поддерева
    // вообще нет его задач) - так "по исполнителям" показывает те же эпики
    // и группы, что и общее дерево, просто отфильтрованные по человеку.
    // _start/_end группового узла тоже пересчитываются заново по обрезанным
    // детям (а не наследуются от исходного узла) - иначе бар эпика в
    // развёрнутом ресурсе показывал бы срок ВСЕГО эпика по проекту (включая
    // работу других людей над ним), а не только срок задач этого человека,
    // и выглядело бы как несуществующее наложение работ по времени.
    function pruneForAssignee(node, assignee) {
        if (node.Children.length === 0) {
            return node.Assignee === assignee ? node : null;
        }
        const prunedChildren = node.Children.map(c => pruneForAssignee(c, assignee)).filter(Boolean);
        if (prunedChildren.length === 0) return null;

        const starts = prunedChildren.map(c => c._start).filter(Boolean);
        const ends = prunedChildren.map(c => c._end).filter(Boolean);
        return {
            ...node,
            Children: prunedChildren,
            _start: starts.length ? d3.min(starts) : null,
            _end: ends.length ? d3.max(ends) : null
        };
    }

    // Собирает листовые задачи (с датами) из поддерева узла - используется,
    // когда ресурс свёрнут, чтобы получить плоский список его задач для
    // упаковки по дорожкам Ганта (см. packLanes/renderGanttLanes).
    function collectLeaves(node, out = []) {
        if (node.Children.length === 0) {
            if (node._start && node._end) out.push(node);
        } else {
            node.Children.forEach(c => collectLeaves(c, out));
        }
        return out;
    }

    // Жадная упаковка: задача кладётся в первую дорожку, где предыдущая
    // задача уже закончилась к её началу; если такой дорожки нет -
    // открывается новая. Конец задачи трактуется как эксклюзивный (день End
    // ещё считается занятым), как и везде в renderTaskBar/renderTimelineRuler.
    function packLanes(tasksSortedByStart) {
        const lanes = [];
        tasksSortedByStart.forEach(t => {
            const lane = lanes.find(l => {
                const last = l[l.length - 1];
                return t._start >= d3.timeDay.offset(last._end, 1);
            });
            if (lane) lane.push(t); else lanes.push([t]);
        });
        return lanes;
    }

    /* ===== EXPAND STATE =====
       Список "свёрнутых" id, а не "развёрнутых" - так по умолчанию (пока
       id нет в списке) всё развёрнуто. Id задач общие для обоих режимов,
       так что свернуть/развернуть конкретный эпик - это на самом деле
       разовое решение "мне сейчас не интересны детали X", а не настройка
       каждого режима по отдельности. */
    const collapsedIds = new Set();

    // Единственное исключение из "по умолчанию развёрнуто" - сами ресурсы:
    // они стартуют свёрнутыми, чтобы сразу открывалась диаграмма Ганта
    // (трек на человека), а не длинный плоский список всех задач всех
    // людей. Разворачивание конкретного ресурса - осознанное действие
    // пользователя, а не состояние по умолчанию.
    resourceNames.forEach(name => collapsedIds.add(`@resource@${name}`));

    function isExpanded(node) {
        return !collapsedIds.has(node.Id);
    }

    /* ===== FILTERING ===== */
    function nodeMatches(node, query, assignee) {
        const matchesQuery = !query ||
            node.Name.toLowerCase().includes(query) ||
            (!node._isGroupHeader && node.Id.toLowerCase().includes(query)) ||
            (node.JiraKey && node.JiraKey.toLowerCase().includes(query));
        const matchesAssignee = !assignee ||
            (node.Assignee && node.Assignee.toLowerCase().includes(assignee.toLowerCase()));
        return matchesQuery && matchesAssignee;
    }

    // Помечает узел и его поддерево как видимые. Если узел сам подошёл под
    // поиск (например, ввели номер эпика) - forced передаётся вниз, и все
    // его потомки остаются видны целиком, а не только те, что тоже
    // совпали бы с запросом по отдельности. Ветки, ведущие к найденному,
    // автоматически разворачиваются.
    function markVisible(node, query, assignee, forced) {
        node._selfMatch = nodeMatches(node, query, assignee);
        const childForced = forced || node._selfMatch;
        const anyChildVisible = node.Children
            .map(c => markVisible(c, query, assignee, childForced))
            .some(Boolean);
        node._visible = forced || node._selfMatch || anyChildVisible;
        if (anyChildVisible && (query || assignee)) {
            collapsedIds.delete(node.Id);
        }
        return node._visible;
    }

    function appendHighlighted(selection, text, query) {
        const idx = query ? text.toLowerCase().indexOf(query) : -1;
        if (idx === -1) {
            selection.text(text);
            return;
        }
        selection.text(null);
        selection.append(() => document.createTextNode(text.slice(0, idx)));
        selection.append('mark').text(text.slice(idx, idx + query.length));
        selection.append(() => document.createTextNode(text.slice(idx + query.length)));
    }

    /* ===== RENDER: заголовки (по одному в каждой панели, оба sticky top) ===== */
    function renderTreeHeader() {
        d3.select('#tree-panel').append('div').attr('class', 'header-row').text('Задача');
    }

    function renderTimelineRuler() {
        const svg = d3.select('#timeline-panel').append('div').attr('class', 'header-row')
            .style('padding', 0)
            .append('svg').attr('width', timelineWidth).attr('height', 22);

        const days = d3.timeDay.range(minDate, d3.timeDay.offset(maxDate, 1));
        svg.selectAll('rect.nonwork-band')
            .data(days.filter(d => isWeekend(d) || globalHolidaySet.has(ymdLocal(d))))
            .enter().append('rect')
            .attr('x', d => xScale(d))
            .attr('y', 0)
            .attr('width', d => Math.max(1, xScale(d3.timeDay.offset(d, 1)) - xScale(d)))
            .attr('height', 22)
            .attr('fill', 'url(#hatch-global)');

        // подписи дат: день.месяц (не просто число) - чтобы переход между
        // месяцами был виден сразу по подписи, а не только по вертикальной
        // линии начала недели; полный год - лишь в начале месяца и на самом
        // первом дне, чтобы не потерять ориентир, к какому году относятся
        // числа рядом.
        const dayMonth = d3.timeFormat('%d.%m');
        svg.selectAll('text.tick')
            .data(days)
            .enter().append('text')
            .attr('x', d => xScale(d) + 3)
            .attr('y', 15)
            .attr('fill', '#fff')
            .attr('font-size', 11)
            .text(d => (d.getDate() === 1 || +d === +minDate) ? fmtDate(d) : dayMonth(d));

        svg.selectAll('line.week')
            .data(d3.timeMonday.range(minDate, d3.timeDay.offset(maxDate, 1)))
            .enter().append('line')
            .attr('x1', d => xScale(d)).attr('x2', d => xScale(d))
            .attr('y1', 0).attr('y2', 22)
            .attr('stroke', 'rgba(255,255,255,.35)');
    }

    function barTooltip(node) {
        const head = node.EpicJiraKey ? `${node.EpicJiraKey} → ${node.Id} — ${node.Name}` : `${node.Id} — ${node.Name}`;
        const lines = [head, `${fmtDate(node._start)} → ${fmtDate(node._end)}`];
        if (node.Assignee) lines.push(node.Assignee);
        return lines.join('\n');
    }

    /* ===== RENDER: полоска задачи (фон нерабочих дней + сам бар + штриховка) =====
       Фон нерабочих дней рисуется на всю ширину строки независимо от
       наличия бара - так видно выходные и там, где задачи нет. Вынесено
       отдельно от бара, т.к. на дорожке Ганта (свёрнутый ресурс) на одном
       фоне рисуется несколько баров подряд, а не один. rowHeight передаётся
       явно - обычная строка (ROW_HEIGHT) и строка дорожки Ганта
       (LANE_ROW_HEIGHT) разной высоты. */
    function renderRowBackground(svg, rowHeight) {
        d3.timeDay.range(minDate, d3.timeDay.offset(maxDate, 1))
            .filter(d => isWeekend(d) || globalHolidaySet.has(ymdLocal(d)))
            .forEach(d => {
                svg.append('rect')
                    .attr('x', xScale(d)).attr('y', 1)
                    .attr('width', Math.max(1, xScale(d3.timeDay.offset(d, 1)) - xScale(d)))
                    .attr('height', rowHeight - 2)
                    .attr('fill', 'url(#hatch-global)')
                    .attr('pointer-events', 'none');
            });
    }

    // muted - приглушить бар (задача уже завершена/на паузе), не убирая его.
    function renderTaskBar(svg, node, {muted = false, rowHeight = ROW_HEIGHT} = {}) {
        const x0 = xScale(node._start), x1 = xScale(d3.timeDay.offset(node._end, 1));
        const width = Math.max(2, x1 - x0);
        const hasLink = !!node.JiraUrl;

        // если у задачи есть ссылка на Jira - сам бар (и его подпись) кликабельны,
        // а не только бейдж слева в дереве; штриховка нерабочих дней поверх бара
        // в ссылку не заворачивается, она чисто декоративная.
        const barLink = hasLink
            ? svg.append('a').attr('href', node.JiraUrl).attr('target', '_blank').attr('rel', 'noopener')
            : svg;

        barLink.append('rect')
            .attr('x', x0).attr('y', 3)
            .attr('width', width).attr('height', rowHeight - 6)
            .attr('rx', 3)
            .attr('fill', colorScale(node.ColorGroupId))
            .attr('opacity', muted ? .4 : 1)
            .append('title')
            .text(barTooltip(node));

        // подпись рисуется на каждом баре, а не только на плотных дорожках
        // Ганта: слева в дереве название и так видно, но при горизонтальном
        // скролле timeline-панели далеко от начала бар остаётся единственным
        // способом понять, что это за задача, и единственным местом, откуда
        // можно перейти в Jira, не прокручивая обратно. Не прячем подпись
        // целиком из-за нехватки места (на плотной дорожке из многих коротких
        // задач это превращало её в "кучу безымянных полосок") - на узких
        // барах просто уменьшаем шрифт, а затем обрезаем посимвольно, пока не
        // влезет (аналог text-overflow:ellipsis, но для SVG-текста, который
        // его не поддерживает). Если есть ссылка на Jira - подпись начинается
        // с ключа задачи в квадратных скобках и подчёркивается, чтобы сразу
        // было видно и номер задачи, и то, что это ссылка.
        const labelClasses = ['gantt-bar-label'];
        if (hasLink) labelClasses.push('linked');
        if (width < 70) labelClasses.push('small');

        const label = barLink.append('text')
            .attr('x', x0 + 6).attr('y', rowHeight / 2 + 4)
            .attr('class', labelClasses.join(' '))
            .attr('opacity', muted ? .6 : 1)
            .text(hasLink ? `[${node.JiraKey}] ${node.Name}` : node.Name);

        const el = label.node();
        while (el.getComputedTextLength() > width - 10 && label.text().length > 1) {
            label.text(label.text().slice(0, -1));
        }
        // совсем крошечный бар (меньше одного символа даже мелким шрифтом) -
        // показать нечего, подпись только мешала бы
        if (el.getComputedTextLength() > width - 10) {
            label.remove();
        }

        // штриховка поверх бара: свой угол для общих нерабочих дней и
        // зеркальный - для личных (отпуск и т.п. у конкретного исполнителя);
        // если день и общий, и личный нерабочий - рисуются оба узора разом.
        const personalSet = node.Assignee ? new Set(resourceNonWorking[node.Assignee] || []) : null;
        d3.timeDay.range(node._start, d3.timeDay.offset(node._end, 1)).forEach(d => {
            const key = ymdLocal(d);
            const global = isWeekend(d) || globalHolidaySet.has(key);
            const personal = !!personalSet && personalSet.has(key);
            if (!global && !personal) return;

            // pointer-events:none - штриховка чисто декоративная и рисуется
            // поверх бара (в т.ч. поверх ссылки на Jira); без этого клик по
            // заштрихованной части бара не долетал до <a> под ней - ссылку
            // получалось открыть только через свободный от штриховки участок.
            const x = xScale(d), w = Math.max(1, xScale(d3.timeDay.offset(d, 1)) - x);
            if (global) {
                svg.append('rect').attr('x', x).attr('y', 3).attr('width', w).attr('height', rowHeight - 6).attr('fill', 'url(#hatch-global)').attr('pointer-events', 'none');
            }
            if (personal) {
                svg.append('rect').attr('x', x).attr('y', 3).attr('width', w).attr('height', rowHeight - 6).attr('fill', 'url(#hatch-personal)').attr('pointer-events', 'none');
            }
        });
    }

    function renderBarCell(barCol, node) {
        const svg = barCol.append('svg').attr('width', timelineWidth).attr('height', ROW_HEIGHT);
        renderRowBackground(svg, ROW_HEIGHT);
        if (node._start && node._end) renderTaskBar(svg, node);
    }

    /* ===== RENDER: строки дорожек Ганта (свёрнутый ресурс) =====
       По одной строке на дорожку, с несколькими барами подряд внутри её
       svg. Строки-заглушки в #tree-panel нужны только для сохранения пары
       "1 строка = 1 data-row в обеих панелях" (синхронизация скролла и
       hover работают по этому индексу). */
    function renderGanttLanes(lanes) {
        lanes.forEach(lane => {
            const laneIdx = rowIndex++;
            const laneClass = 'tree-row' + (laneIdx % 2 === 1 ? ' stripe' : '');

            d3.select('#tree-panel').append('div')
                .attr('class', laneClass).attr('data-row', laneIdx)
                .style('height', `${LANE_ROW_HEIGHT}px`)
                .on('mouseenter', () => setRowHover(laneIdx, true))
                .on('mouseleave', () => setRowHover(laneIdx, false));

            const laneRow = d3.select('#timeline-panel').append('div')
                .attr('class', laneClass).attr('data-row', laneIdx)
                .style('height', `${LANE_ROW_HEIGHT}px`)
                .on('mouseenter', () => setRowHover(laneIdx, true))
                .on('mouseleave', () => setRowHover(laneIdx, false));
            const svg = laneRow.append('svg').attr('width', timelineWidth).attr('height', LANE_ROW_HEIGHT);
            renderRowBackground(svg, LANE_ROW_HEIGHT);
            lane.forEach(t => {
                renderTaskBar(svg, t, {muted: !!t.StatusLabel, rowHeight: LANE_ROW_HEIGHT});
            });
        });
    }

    /* ===== RENDER: ONE TASK ROW =====
       Рисует пару синхронизированных строк - в #tree-panel (название) и в
       #timeline-panel (полоска) - с общим data-row-индексом: по нему же
       синхронизируется hover между панелями (см. setRowHover) и чередование
       фона (через явный класс "stripe", а не nth-child - линейка дат и
       заголовок теперь в отдельной панели, так что nth-child по факту тоже
       был бы неверным индексом).
       depth передаётся явно, а не берётся из поля узла: в режиме "по
       исполнителям" одни и те же узлы-задачи оказываются на другой
       глубине, чем в дереве целиком.
       Если node - заголовок ресурса (_isGroupHeader) и он сейчас свёрнут -
       вместо его детей рисуются не строки дерева, а дорожки Ганта,
       собранные из ВСЕХ листовых задач этого человека (см. collectLeaves/
       renderGanttLanes) - так "расхлопывание" ресурса не теряет ни одной
       задачи, просто меняет её представление с бара на дорожке на
       собственную строку дерева. */
    let rowIndex = 0;

    function renderRow(node, query, depth) {
        if (!node._visible) return;

        const idx = rowIndex++;
        const rowClass = 'tree-row' + (idx % 2 === 1 ? ' stripe' : '') + (node.StatusLabel ? ' muted' : '');

        const collapsedGanttLanes = (node._isGroupHeader && !isExpanded(node))
            ? packLanes(collectLeaves(node).filter(n => n._visible).sort((a, b) => a._start - b._start))
            : null;

        const label = d3.select('#tree-panel').append('div')
            .attr('class', rowClass)
            .attr('data-row', idx)
            .style('padding-left', `${8 + depth * 18}px`)
            .on('mouseenter', () => setRowHover(idx, true))
            .on('mouseleave', () => setRowHover(idx, false));

        // название - в отдельной резиновой зоне (только оно обрезается
        // многоточием, если не помещается); бейджи - в своей, нерезиновой.
        const nameWrap = label.append('div').attr('class', 'name-wrap').attr('title', node.Name);
        const badges = label.append('div').attr('class', 'badges');

        const hasChildren = node.Children.length > 0;
        const caret = nameWrap.append('span').attr('class', hasChildren ? 'caret' : 'caret caret-empty');
        if (hasChildren) {
            caret.text(isExpanded(node) ? '▾' : '▸')
                .on('click', () => {
                    if (isExpanded(node)) collapsedIds.add(node.Id); else collapsedIds.delete(node.Id);
                    render();
                });
        }

        if (!node._isGroupHeader) {
            appendHighlighted(nameWrap.append('span').attr('class', 'task-id'), node.Id + ' ', query);
        }
        const nameSpan = nameWrap.append('span');
        if (node._isGroupHeader) nameSpan.style('font-weight', '600');
        appendHighlighted(nameSpan, node.Name, query);

        // родительский эпик - приглушённой меткой перед собственной, чтобы
        // было видно, к чему относится задача, не разворачивая дерево вверх
        if (node.EpicJiraKey) {
            const epic = badges.append(node.EpicJiraUrl ? 'a' : 'span').attr('class', 'jira-badge epic-badge').text(node.EpicJiraKey);
            if (node.EpicJiraUrl) epic.attr('href', node.EpicJiraUrl).attr('target', '_blank').attr('rel', 'noopener');
        }
        if (node.JiraKey) {
            const jira = badges.append(node.JiraUrl ? 'a' : 'span').attr('class', 'jira-badge').text(node.JiraKey);
            if (node.JiraUrl) jira.attr('href', node.JiraUrl).attr('target', '_blank').attr('rel', 'noopener');
        }
        // исполнитель и так виден по заголовку группы в режиме "по
        // исполнителям" - бейдж там был бы лишним дублированием.
        if (node.Assignee && viewMode !== 'resources') {
            badges.append('span').attr('class', 'assignee-badge').text(node.Assignee);
        }
        if (node.StatusLabel) {
            badges.append('span').attr('class', 'status-badge').text(node.StatusLabel);
        }
        // свёрнутый ресурс - вместо статуса показываем сводку по тому, что
        // скрыто под свёрнутым треком (сама первая дорожка рисуется прямо в
        // этой же строке, см. ниже - "дорожки" тут не считаем: у ресурса их
        // почти всегда одна, лишняя цифра только путает).
        if (collapsedGanttLanes) {
            const taskCount = collapsedGanttLanes.reduce((n, l) => n + l.length, 0);
            badges.append('span').attr('class', 'assignee-badge').text(`${taskCount} задач`);
        }

        // Высота строки заголовка ресурса подстраивается под дорожку Ганта,
        // когда та встроена прямо в эту же строку (см. ниже) - иначе имя
        // висит над отдельной пустой строкой, а сами бары начинаются только
        // на следующей.
        const headerRowHeight = collapsedGanttLanes ? LANE_ROW_HEIGHT : ROW_HEIGHT;
        if (collapsedGanttLanes) {
            label.style('height', `${headerRowHeight}px`);
        }

        const barRow = d3.select('#timeline-panel').append('div')
            .attr('class', rowClass)
            .attr('data-row', idx)
            .on('mouseenter', () => setRowHover(idx, true))
            .on('mouseleave', () => setRowHover(idx, false));

        if (collapsedGanttLanes) {
            // первая дорожка - прямо в строке с именем ресурса, а не на
            // отдельной строке ниже; остальные дорожки (если задачи
            // пересекаются по датам) идут своими строками через renderGanttLanes.
            barRow.style('height', `${headerRowHeight}px`);
            const svg = barRow.append('svg').attr('width', timelineWidth).attr('height', headerRowHeight);
            renderRowBackground(svg, headerRowHeight);
            (collapsedGanttLanes[0] || []).forEach(t => {
                renderTaskBar(svg, t, {muted: !!t.StatusLabel, rowHeight: headerRowHeight});
            });
        } else {
            renderBarCell(barRow, node);
        }

        if (hasChildren && isExpanded(node)) {
            node.Children.forEach(c => renderRow(c, query, depth + 1));
        } else if (collapsedGanttLanes && collapsedGanttLanes.length > 1) {
            renderGanttLanes(collapsedGanttLanes.slice(1));
        }
    }

    function setRowHover(idx, on) {
        d3.select(`#tree-panel [data-row="${idx}"]`).classed('hover', on);
        d3.select(`#timeline-panel [data-row="${idx}"]`).classed('hover', on);
    }

    /* ===== MAIN RENDER ===== */
    function render() {
        rowIndex = 0;

        const query = d3.select('#search').property('value').trim().toLowerCase();
        const assignee = d3.select('#assignee-filter').property('value').trim();

        d3.select('#tree-panel').html('');
        d3.select('#timeline-panel').html('');
        renderTreeHeader();
        renderTimelineRuler();

        const roots = getRoots();
        const anyVisible = roots.map(r => markVisible(r, query, assignee, false)).some(Boolean);

        if (!anyVisible) {
            d3.select('#tree-panel').append('div').attr('class', 'empty-message').text('Ничего не найдено');
            return;
        }

        roots.forEach(r => renderRow(r, query, 0));
    }

    function setAllExpanded(value) {
        (function walk(node) {
            if (value) collapsedIds.delete(node.Id); else if (node.Children.length) collapsedIds.add(node.Id);
            node.Children.forEach(walk);
        })({Id: '@root@', Children: getRoots()});
    }

    /* ===== CONTROLS ===== */
    d3.select('#search').on('input', render);
    d3.select('#assignee-filter').on('input', render);
    d3.select('#expand-all').on('click', () => { setAllExpanded(true); render(); });
    d3.select('#collapse-all').on('click', () => { setAllExpanded(false); render(); });
    d3.select('#clear-filters').on('click', () => {
        d3.select('#search').property('value', '');
        d3.select('#assignee-filter').property('value', '');
        render();
    });

    // Кнопка "на сегодня" - только если есть дата среза (FactDate) и она
    // заметно (>2 недель) отстоит от начала плана; сам план по умолчанию
    // всегда открывается с начала, а не с сегодняшнего дня - это осознанно,
    // кнопка только предлагает быстро туда перескочить, а не делает это сама.
    (function wireTodayButton() {
        if (!todayDate) return;
        const gapDays = Math.abs((todayDate - minDate) / 86400000);
        if (gapDays <= 14) return;

        d3.select('#goto-today').style('display', null).on('click', () => {
            const timelinePanel = document.getElementById('timeline-panel');
            timelinePanel.scrollLeft = xScale(todayDate) - timelinePanel.clientWidth / 2;
        });
    })();

    d3.selectAll('.view-switch button').on('click', function () {
        viewMode = this.dataset.mode;
        d3.selectAll('.view-switch button').classed('active', false);
        d3.select(this).classed('active', true);
        render();
    });
    d3.select('#view-resources').classed('active', true);

    // синхронизация вертикального скролла между панелями - обе прокручиваются
    // как одна таблица, хоть и состоят из двух независимых DOM-деревьев;
    // флаг syncingScroll защищает от бесконечного пинг-понга событий scroll.
    (function wireScrollSync() {
        const treePanel = document.getElementById('tree-panel');
        const timelinePanel = document.getElementById('timeline-panel');
        let syncingScroll = false;

        treePanel.addEventListener('scroll', () => {
            if (syncingScroll) return;
            syncingScroll = true;
            timelinePanel.scrollTop = treePanel.scrollTop;
            syncingScroll = false;
        });
        timelinePanel.addEventListener('scroll', () => {
            if (syncingScroll) return;
            syncingScroll = true;
            treePanel.scrollTop = timelinePanel.scrollTop;
            syncingScroll = false;
        });
    })();

    render();
</script>
</body>
</html>
